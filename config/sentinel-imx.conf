# sentinel-imx daemon configuration.
#
# Format: key=value, one per line. '#' starts a comment. Leading/trailing
# whitespace is ignored. Every key can be overridden by an environment variable
# named SENTINEL_<KEY_UPPERCASE> (e.g. SENTINEL_THRESHOLD=0.8).

# Operating mode:
#   auto    - infer when a model is present, otherwise capture only (default)
#   capture - only sanitize/encode/record log templates (collect training data)
#   infer   - require a model and evaluate every event
mode=auto

# TensorFlow Lite model. If missing in 'auto' mode the daemon runs capture-only.
model_path=/usr/share/sentinel-imx/model_quant.tflite

# NXP Vivante external delegate for NPU acceleration. If absent, inference
# falls back to CPU.
delegate_path=/usr/lib/libvx_delegate.so

# Reconstruction-loss (MSE) alert threshold. This is model-specific: the trainer
# calibrates a value from the normal-loss distribution and writes it next to the
# model as out/threshold.txt (roughly 3x the p90 "steady-state noise floor").
# Retrain -> copy the suggested value here. 45 matches the shipped model.
threshold=45

# External program executed when loss > threshold. It receives context via
# SENTINEL_* environment variables (see README).
alert_script=/usr/libexec/sentinel-imx/on-alert.sh

# Minimum seconds between two alert-script invocations (anti-storm).
alert_cooldown_sec=10

# Append-only JSONL file with one sanitized+encoded record per event.
capture_path=/var/lib/sentinel-imx/capture.jsonl

# Event sources.
#   journal - systemd journal: kernel messages (_TRANSPORT=kernel, tagged
#             source "kmsg") plus userspace logs (tagged source "journal").
#   dbus    - selected D-Bus system-bus signals (systemd units + logind).
journal=true
dbus=true

# D-Bus match rules to subscribe to (repeatable). If none are given, sensible
# defaults are used (systemd unit failures + logind session signals).
#dbus_match=type='signal',sender='org.freedesktop.systemd1',interface='org.freedesktop.systemd1.Manager',member='UnitNew'
#dbus_match=type='signal',interface='org.freedesktop.login1.Manager'
